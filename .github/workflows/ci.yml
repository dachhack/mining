name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit, scenario, and determinism tests all run under Vitest.
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser is kept between runs, under the Playwright version it
      # belongs to (issue #110): downloading it, and above all fetching its
      # system packages from a slow mirror, once took over six minutes.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Download Chromium (only when it is not in the cache)
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The runner image already has the libraries Chromium needs; the
      # packages `--with-deps` used to add were fonts. So try to start the
      # browser, and install the system packages only if that fails.
      - name: Install Chromium's system packages (only if the browser does not start)
        run: |
          node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())" \
            || npx playwright install-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

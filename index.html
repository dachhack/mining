<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mining Game</title>
    <style>
      :root {
        color-scheme: dark;
        /* The system bars' insets: the status bar at the top, the gesture bar
           at the bottom, a camera cutout at a side. The app draws edge to edge
           on Android 15 and later, under the bars, so the page keeps clear of
           them. env() has them on WebView 140 and later; Capacitor also sets
           --safe-area-inset-* on this element (its SystemBars plugin). The
           larger of the two is used, so either is enough. */
        --inset-top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
        --inset-right: max(env(safe-area-inset-right, 0px), var(--safe-area-inset-right, 0px));
        --inset-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
        --inset-left: max(env(safe-area-inset-left, 0px), var(--safe-area-inset-left, 0px));
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14110f;
        color: #e8e2d9;
        font-family: system-ui, sans-serif;
      }
      #app {
        padding: var(--inset-top) var(--inset-right) var(--inset-bottom) var(--inset-left);
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
